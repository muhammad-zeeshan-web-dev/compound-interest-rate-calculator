<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Interest Calculator</h1>

    <form>

        <label for="principal">Principal Amount:</label>
        <input type="number" id="principal" placeholder="Enter amount">

        <label for="rate">Interest Rate (%):</label>
        <input type="number" id="rate" placeholder="Enter rate">

        <label for="years">Years:</label>
        <input type="number" id="years" placeholder="Enter years">

        <button type="button" onclick="calculator()">Submit</button>

        <p id="total">
            Total:
            <span id="total-amount">$0.00</span>
        </p>

    </form>

    <script src="script.js"></script>

</body>

</html>
